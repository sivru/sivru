name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # We pin pnpm here (not via a `packageManager` field + corepack) so
      # devs with older Node versions don't have to fight stale corepack
      # signing keys. To bump: change `version` here AND in the README.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # `pnpm build` runs tsc with emit, which also typechecks. Run it first
      # so dist/ exists for any cross-package imports the typecheck step
      # validates afterwards (e.g. benchmarks → @sivru/search).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  package-contents:
    name: package contents (SKILL.md ships in @sivru/cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build

      # The bundled SKILL.md is a non-compiled asset. `tsc` only emits .js
      # into dist/, so SKILL.md ships only because package.json "files"
      # lists it. This gate fails the PR if that entry is ever dropped —
      # otherwise `sivru skill install` would break for every npm user and
      # local dev would not notice (the source tree always has the file).
      - name: Verify SKILL.md is in the @sivru/cli package tarball
        run: |
          cd packages/cli
          npm pack --dry-run --json | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const files = (data[0]?.files ?? []).map((f) => f.path);
            if (!files.includes("SKILL.md")) {
              console.error("FAIL: SKILL.md missing from the @sivru/cli tarball");
              console.error("tarball files: " + files.join(", "));
              process.exit(1);
            }
            console.log("OK: SKILL.md is in the @sivru/cli tarball");
          '

  benchmark-gate:
    name: benchmark gate (perf regression vs baseline)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build

      # Need the pinned corpus for the perf bench. ~130 MB; the action's
      # default cache strips it after the run.
      - name: Fetch corpus
        run: pnpm --filter @sivru/benchmarks fetch-corpus

      # Compares against benchmarks/perf-baseline.json. Tolerances:
      #   chunks    +1%   (deterministic — catches chunker drift)
      #   buildMs   +50%  (CI runners vary 2-3×; only catches blowouts)
      #   peakHeap  +15%  (when baseline >= 4 MiB)
      - name: Perf gate
        run: pnpm --filter @sivru/benchmarks bench:perf:gate
